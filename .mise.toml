[settings]
lockfile = true

[env]
WORKER_DIR = "{{config_root}}/worker"
PROXY_DIR = "{{config_root}}/proxy"
DATA_DIR = "{{config_root}}/.test-data"
GNUCASH_BOOK_PATH = "/data/project.gnucash"

[tools]
container = "0.12.1"
swiftformat = { version = "latest", no_app = "true", rename_exe = "swiftformat" }
swiftlint = "latest"

# -- container system --

[tasks.start-container-system]
description = "Start container system (if not already running)"
run = "container system status || container system start"

[tasks.prune-images]
description = "Prune unused images"
run = "container image prune --all && container image list"

[tasks.prune-volumes]
description = "Prune unused volumes"
run = "container volume prune && container volume list"

[tasks.delete-container-images]
description = "Delete dev image to force rebuild on next build-dev"
run = "container image delete --force gnucash-mcp:dev gnucash-mcp:latest"

[tasks.shutdown-container-system]
description = "Shutdown container system"
run = "container system stop"

# ── install ───────────────────────────────────────────────────────────────────

[tasks.install-all]
description = "One-time setup: build images, init book, create sparsebundle, install proxy. For upgrades use install-app."
depends = ["create-book-volume", "install-app"]

[tasks.create-book-volume]
description = "Create ~/Documents/gnucash-mcp--project.sparsebundle and migrate book into it (one-time)"
depends = ["init-book"]
run = "{{config_root}}/bin/create-book-volume.zsh"

[tasks.uninstall-app]
description = "Remove gnucash-mcp binary, LaunchAgent plist, and Claude Desktop registration"
run = """
set -euo pipefail
APPDIR="$HOME/Library/Application Support/gnucash-mcp"
BROWSE_DIR="$HOME/.local/bin"
PLIST="$HOME/Library/LaunchAgents/com.gnucash-mcp.myproject.plist"
BINARY="${APPDIR}/gnucash-mcp"

# Remove mcpServers entry and LaunchAgent plist via the binary
if [[ -f "$BINARY" ]]; then
  "$BINARY" unregister
else
  echo "Binary not found — skipping unregister"
fi

# Unload LaunchAgent (plist already removed by unregister)
launchctl unload "$PLIST" 2>/dev/null || true

# Remove binary, resource bundle, and app directory
if [[ -f "$BINARY" ]]; then
  rm "$BINARY"
  echo "Removed $BINARY"
else
  echo "Binary not found — skipping"
fi
rm -rf "${APPDIR}/gnucash-mcp_gnucash-mcp.bundle"
rmdir "$APPDIR" 2>/dev/null || true

# Remove gnucash-browse
BROWSE="${BROWSE_DIR}/gnucash-browse"
if [[ -f "$BROWSE" ]]; then
  rm "$BROWSE"
  echo "Removed $BROWSE"
else
  echo "gnucash-browse not found — skipping"
fi

echo ""
echo "Done. Restart Claude Desktop to deregister the server."
"""

[tasks.install-app]
description = "Build and install gnucash-mcp binary (release), then register with Claude Desktop (or Claude Code via --code)"
depends = ["build-proxy", "build-worker"]
usage = '''
flag "--code" help="Register with Claude Code instead of Claude Desktop"
'''
run = """
set -euo pipefail
CONFIG="${BUILD_CONFIG:-release}"
if [[ "${usage_code:-false}" == "true" ]]; then
  REGISTER_WITH="code"
else
  REGISTER_WITH="desktop"
fi
APPDIR="$HOME/Library/Application Support/gnucash-mcp"
BROWSE_DIR="$HOME/.local/bin"
mkdir -p "${APPDIR}" "${BROWSE_DIR}"

echo "Installing ${CONFIG} binary to ${APPDIR}/gnucash-mcp…"
cp "$TMPDIR/gnucash-mcp-build/${CONFIG}/gnucash-mcp" "${APPDIR}/gnucash-mcp"
chmod +x "${APPDIR}/gnucash-mcp"
codesign --force --sign - "${APPDIR}/gnucash-mcp"

# SwiftPM emits resources into a sibling .bundle directory; Bundle.module
# looks for it next to the executable at runtime.
BUNDLE_NAME="gnucash-mcp_gnucash-mcp.bundle"
rm -rf "${APPDIR}/${BUNDLE_NAME}"
cp -R "$TMPDIR/gnucash-mcp-build/${CONFIG}/${BUNDLE_NAME}" "${APPDIR}/${BUNDLE_NAME}"

echo "Installing to ${BROWSE_DIR}/gnucash-browse…"
cp "$(git rev-parse --show-toplevel)/bin/gnucash-browse" "${BROWSE_DIR}/gnucash-browse"
chmod +x "${BROWSE_DIR}/gnucash-browse"
codesign --force --sign - "${BROWSE_DIR}/gnucash-browse"

case "$REGISTER_WITH" in
  desktop)
    echo "Registering with Claude Desktop…"
    "${APPDIR}/gnucash-mcp" register --binary-path "${APPDIR}/gnucash-mcp"
    POST_MSG="Restart Claude Desktop to pick up the new version."
    ;;
  code)
    if ! command -v claude >/dev/null 2>&1; then
      echo "error: claude CLI not found on PATH" >&2
      exit 1
    fi
    echo "Registering with Claude Code (local scope, this repo)…"
    claude mcp remove gnucash-myproject -s local >/dev/null 2>&1 || true
    claude mcp add gnucash-myproject -s local -- "${APPDIR}/gnucash-mcp" start
    POST_MSG="Reload your Claude Code window to pick up the new server."
    ;;
  *)
    echo "error: REGISTER_WITH must be 'desktop' or 'code' (got: $REGISTER_WITH)" >&2
    exit 1
    ;;
esac

echo ""
echo "Done. $POST_MSG"
echo "Binary: ${APPDIR}/gnucash-mcp (${CONFIG})"
"""

[tasks.dev-install-app]
description = "Like install-app but builds a debug binary (3-5x faster; for edit→test loops)"
usage = '''
flag "--code" help="Register with Claude Code instead of Claude Desktop"
'''
run = """
set -euo pipefail
if [[ "${usage_code:-false}" == "true" ]]; then
  BUILD_CONFIG=debug mise run install-app --code
else
  BUILD_CONFIG=debug mise run install-app
fi
"""

# ── buck2 ─────────────────────────────────────────────────────────────────────

[tasks.fetch-buck-prelude]
description = "Fetch the buck2 prelude matching the currently installed buck2 binary"
run = """
set -euo pipefail
PRELUDE_DIR="${PROXY_DIR}/.buck/prelude"

# Extract the commit hash embedded in `buck2 --version`
# Format: "buck2 YYYY-MM-DD-<sha>"
VERSION=$(buck2 --version)
COMMIT=$(echo "$VERSION" | grep -oE '[0-9a-f]{40}$')
if [[ -z "$COMMIT" ]]; then
  echo "error: could not parse commit hash from: $VERSION" >&2
  exit 1
fi

# Skip if already at this commit
STAMP="${PROXY_DIR}/.buck/prelude.commit"
if [[ -f "$STAMP" ]] && [[ "$(cat "$STAMP")" == "$COMMIT" ]]; then
  echo "fetch-buck-prelude: prelude already at $COMMIT, skipping"
  exit 0
fi

echo "fetch-buck-prelude: fetching prelude @ ${COMMIT:0:12} …"
WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT

# Set sparse-checkout to prelude/ before fetching so git only downloads
# tree+blob objects for that subdirectory — one network round trip.
git init "$WORK/buck2"
git -C "$WORK/buck2" remote add origin https://github.com/facebook/buck2
git -C "$WORK/buck2" sparse-checkout init --cone
git -C "$WORK/buck2" sparse-checkout set prelude
git -C "$WORK/buck2" \
  -c protocol.version=2 \
  fetch --depth=1 --filter=blob:none origin "$COMMIT"
git -C "$WORK/buck2" checkout FETCH_HEAD

rm -rf "$PRELUDE_DIR"
mkdir -p "$(dirname "$PRELUDE_DIR")"
mv "$WORK/buck2/prelude" "$PRELUDE_DIR"
echo "$COMMIT" > "$STAMP"
echo "fetch-buck-prelude: done ($(find "$PRELUDE_DIR" -name '*.bzl' | wc -l | tr -d ' ') bzl files)"
"""

[tasks.gen-buck]
description = "Generate Buck2 BUCK files from the resolved SPM package graph"
depends = ["fetch-buck-prelude"]
run = """
set -euo pipefail
swift package resolve --package-path ${PROXY_DIR}
python3 ${PROXY_DIR}/scripts/spm2buck.py
"""

# ── build ─────────────────────────────────────────────────────────────────────

[tasks.build-worker]
description = "Build prod image (gnucash-mcp:latest)"
run = "container build --pull -t gnucash-mcp:latest ${WORKER_DIR}"

[tasks.build-worker-dev]
description = "Build dev image (gnucash-mcp:dev) — includes uv/ruff/pyright"
depends = ["start-container-system"]
run = "container build --pull --target dev -t gnucash-mcp:dev ${WORKER_DIR}"

[tasks.build-proxy]
description = "Build gnucash-mcp Swift binary (release by default; set BUILD_CONFIG=debug for dev)"
run = """
set -euo pipefail
CONFIG="${BUILD_CONFIG:-release}"
GIT_HASH=$(git -C {{config_root}} rev-parse --short HEAD 2>/dev/null || echo "dev")
GIT_DATE=$(git -C {{config_root}} log -1 --format=%cd --date=short 2>/dev/null || echo "unknown")
GIT_DIRTY=$(git -C {{config_root}} status --porcelain 2>/dev/null | grep -q . && echo "+dirty" || echo "")
VERSION_FILE="${PROXY_DIR}/Sources/gnucash-mcp/Version.swift"
NEW_VERSION_CONTENT=$(printf '// Auto-generated by build-proxy mise task. Do not edit.\nlet buildCommit = "%s%s"\nlet buildDate = "%s"\n' \
  "$GIT_HASH" "$GIT_DIRTY" "$GIT_DATE")
# Only rewrite if content differs — touching the file under WMO recompiles the whole module.
if [[ ! -f "$VERSION_FILE" ]] || [[ "$(cat "$VERSION_FILE")" != "$NEW_VERSION_CONTENT" ]]; then
  printf '%s' "$NEW_VERSION_CONTENT" > "$VERSION_FILE"
fi
SANDBOX_FLAG=${CLAUDECODE:+--disable-sandbox}
cd ${PROXY_DIR} && \
  swift build --configuration "$CONFIG" $SANDBOX_FLAG \
    --build-path "$TMPDIR/gnucash-mcp-build"
"""

[tasks.build]
description = "Build the worker and proxy"
depends = ["build-worker", "build-proxy"]

[tasks.lint-proxy-slow-types]
description = "Flag expressions in proxy Sources/ that take >threshold ms to type-check"
usage = 'arg "[threshold_ms]" help="Type-check time threshold in ms (default: 100)" default="100"'
run = """
set -euo pipefail
THRESHOLD="${usage_threshold_ms:-100}"
SANDBOX_FLAG=${CLAUDECODE:+--disable-sandbox}
cd ${PROXY_DIR}
swift build $SANDBOX_FLAG --build-path "$TMPDIR/gnucash-mcp-build" \
  -Xswiftc -Xfrontend -Xswiftc "-warn-long-expression-type-checking=$THRESHOLD" \
  -Xswiftc -Xfrontend -Xswiftc "-warn-long-function-bodies=$THRESHOLD" \
  2>&1 | grep -E "warning:.*took .*ms to type-check" || echo "No expressions exceeded ${THRESHOLD}ms."
"""

[tasks.profile-proxy-build]
description = "Clean + serialized swift build with per-module wall-clock timing (slow; profiling only)"
usage = 'flag "--release" help="Profile release build (default: debug)"'
run = """
set -euo pipefail
CONFIG="debug"
[ "${usage_release:-false}" = "true" ] && CONFIG="release"
SANDBOX_FLAG=${CLAUDECODE:+--disable-sandbox}
cd ${PROXY_DIR}
PROFILE_PATH="$TMPDIR/gnucash-mcp-profile"
rm -rf "$PROFILE_PATH"
swift build -j 1 --configuration "$CONFIG" $SANDBOX_FLAG --build-path "$PROFILE_PATH" 2>&1 \
  | perl -ne 'BEGIN{ use Time::HiRes qw(time); $last=time(); $first=1 } if (/^(?:Compiling|Building|Emitting) /) { $now=time(); printf("%6.1fs  %s", $now-$last, $prev) unless $first; $prev=$_; $last=$now; $first=0 } END { printf("%6.1fs  %s", time()-$last, $prev) unless $first }'
"""

# ── dev tools ─────────────────────────────────────────────────────────────────

[tasks.fmt-worker]
description = "ruff format in dev container (source volume-mounted)"
depends = ["build-worker-dev"]
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -v ${WORKER_DIR}/tests:/src/tests:rw \
  --entrypoint bash \
  gnucash-mcp:dev \
  -c "cd /src && \
  uv run --active ruff format gnucash_mcp scripts tests"
"""

[tasks.lint-worker]
description = "ruff check + pyright typecheck in dev container (source volume-mounted)"
depends = ["build-worker-dev", "fmt-worker"]
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -v ${WORKER_DIR}/tests:/src/tests:rw \
  -v ${WORKER_DIR}/typings:/src/typings:ro \
  -v ${WORKER_DIR}/pyrightconfig.json:/src/pyrightconfig.json:ro \
  --entrypoint bash \
  gnucash-mcp:dev \
  -c "cd /src && \
    uv run --active ruff check --fix --no-cache gnucash_mcp scripts tests && \
    uv run --active pyright gnucash_mcp scripts tests"
"""

[tasks.test-worker]
description = "Run test suite in dev container"
usage = 'arg "[filter]" help="pytest node-id or file path passed as -k filter" default=""'
depends = []
run = """
PYTEST_ARGS="tests/ -v"
[ -n "${usage_filter:-}" ] && PYTEST_ARGS="tests/ -v -k '${usage_filter}'"
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:ro \
  -v ${WORKER_DIR}/scripts:/src/scripts:ro \
  -v ${WORKER_DIR}/tests:/src/tests:ro \
  --entrypoint bash \
  gnucash-mcp:dev \
  -c "cd /src && uv run --active --frozen pytest ${PYTEST_ARGS}"
"""

[tasks.fmt-proxy]
description = "Format Swift code"
run = """
SANDBOX_FLAG=${CLAUDECODE:- --verbose}
swiftformat $SANDBOX_FLAG ${PROXY_DIR}/Sources ${PROXY_DIR}/Tests
"""

[tasks.lint-proxy]
description = "Lint Swift code"
depends = ["fmt-proxy"]
run = """
SANDBOX_FLAG=${CLAUDECODE:- --fix}
swiftlint lint $SANDBOX_FLAG ${PROXY_DIR}/Sources ${PROXY_DIR}/Tests
"""

[tasks.test-proxy]
description = "Run Swift proxy tests (debug build)"
usage = 'flag "--coverage" help="Collect and report line coverage after tests"'
run = """
SANDBOX_FLAG=${CLAUDECODE:+--disable-sandbox}
BUILD_PATH="$TMPDIR/gnucash-mcp-build"
COVERAGE_FLAG=""
[ "${usage_coverage:-false}" = "true" ] && COVERAGE_FLAG="--enable-code-coverage"
cd ${PROXY_DIR} && \
swift test --configuration debug $SANDBOX_FLAG --build-path "$BUILD_PATH" $COVERAGE_FLAG
if [ -n "$COVERAGE_FLAG" ]; then
  PROFDATA=$(find "$BUILD_PATH" -name "default.profdata" | grep codecov | head -1)
  TEST_BIN=$(find "$BUILD_PATH" -path "*/gnucash-mcpPackageTests.xctest/Contents/MacOS/gnucash-mcpPackageTests" ! -name "*.dSYM" | head -1)
  xcrun llvm-cov report \
    --instr-profile="$PROFDATA" \
    "$TEST_BIN" \
    --sources "${PROXY_DIR}/Sources"
fi
"""

[tasks.lint]
description = "Lint all the code"
depends = ["lint-worker", "lint-proxy", "lint-proxy-slow-types"]

[tasks.test]
description = "Run all tests"
depends = ["test-worker", "test-proxy"]

# ── runtime ───────────────────────────────────────────────────────────────────

[tasks.init-book]
description = """Initialize GnuCash book in .test-data/
  — required once before 'mise run' or 'mise shell'; not
  needed for 'mise test' (fixtures create their own books)"""
depends = ["build"]
run = """
set -euo pipefail
mkdir -p "${DATA_DIR}"
container run --rm \
  -v ${DATA_DIR}:/data:rw \
  -e GNUCASH_BOOK_PATH \
  --entrypoint python3 \
  gnucash-mcp:latest \
  /src/scripts/init_book.py \
|| { echo "error: init-book failed — see container output above"; exit 1; }
"""

[tasks.run]
description = "One-shot dispatch: pipe JSON-RPC on stdin → stdout"
depends = ["init-book"]
run = """
container run --rm -i \
  -v ${DATA_DIR}:/data:rw \
  -e GNUCASH_BOOK_PATH \
  gnucash-mcp:latest
"""

[tasks.shell]
description = "Interactive shell in prod container"
depends = ["init-book"]
run = """
container run --rm -it \
  -v ${DATA_DIR}:/data:rw \
  -e GNUCASH_BOOK_PATH \
  --entrypoint /bin/bash \
  gnucash-mcp:latest
"""

[tasks.shell-dev]
description = "Interactive shell in dev container with source mounted rw"
depends = ["build-worker-dev", "init-book"]
run = """
container run --rm -it \
  -v ${DATA_DIR}:/data:rw \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -e GNUCASH_BOOK_PATH \
  --entrypoint /bin/bash \
  gnucash-mcp:dev
"""

[tasks.clean]
description = "Remove ephemeral test data"
run = "rm -f ${DATA_DIR}/*.gnucash* ${DATA_DIR}/*.jsonl ${PROXY_DIR}/.build ${PROXY_DIR}/Version.swift"

[tasks.purge-swift-cache]
description = "Purge Swift module cache and compilation cache"
run = """
set -euo pipefail
cd ${PROXY_DIR}
swift package purge-cache
rm -rf "$TMPDIR/gnucash-mcp-build"
echo "Swift caches purged."
"""

[tasks.cleaner]
description = "Clean all build artifacts and test data (images, volumes, etc.)"
depends = ["delete-container-images", "clean", "purge-swift-cache"]
