[env]
WORKER_DIR = "{{config_root}}/worker"

# ── build ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build prod image (gnucash-mcp:latest)"
run = "container build -t gnucash-mcp:latest ${WORKER_DIR}"

[tasks.build-dev]
description = "Build dev image (gnucash-mcp:dev) — includes uv/ruff/ty"
run = "container build --target dev -t gnucash-mcp:dev ${WORKER_DIR}"

[tasks.build-base]
description = "Build base image (gnucash-mcp:base)"
run = "container build --target base -t gnucash-mcp:base ${WORKER_DIR}"

# ── dev tools ─────────────────────────────────────────────────────────────────

[tasks.lint]
description = "ruff check + ty check in dev container (source volume-mounted)"
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:ro \
  -v ${WORKER_DIR}/scripts:/src/scripts:ro \
  gnucash-mcp:dev \
  bash -c "cd /src && ruff check gnucash_mcp scripts && ty check gnucash_mcp"
"""

[tasks.fmt]
description = "ruff format in dev container (source volume-mounted)"
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  gnucash-mcp:dev \
  bash -c "cd /src && ruff format gnucash_mcp scripts"
"""

# ── runtime ───────────────────────────────────────────────────────────────────

[tasks.run]
description = "One-shot dispatch: pipe JSON-RPC on stdin → stdout"
run = """
container run --rm -i \
  -v {{config_root}}/.test-data:/data:rw \
  -e GNUCASH_BOOK_PATH=/data/project.gnucash \
  gnucash-mcp:latest
"""

[tasks.shell]
description = "Interactive shell in prod container"
run = """
container run --rm -it \
  -v {{config_root}}/.test-data:/data:rw \
  -e GNUCASH_BOOK_PATH=/data/project.gnucash \
  --entrypoint /bin/bash \
  gnucash-mcp:latest
"""

[tasks.shell-dev]
description = "Interactive shell in dev container with source mounted rw"
run = """
container run --rm -it \
  -v {{config_root}}/.test-data:/data:rw \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -e GNUCASH_BOOK_PATH=/data/project.gnucash \
  --entrypoint /bin/bash \
  gnucash-mcp:dev
"""

[tasks.init-book]
description = "Initialize GnuCash book in .test-data/"
run = """
container run --rm \
  -v {{config_root}}/.test-data:/data:rw \
  -e GNUCASH_BOOK_PATH=/data/project.gnucash \
  --entrypoint python3 \
  gnucash-mcp:latest \
  /src/scripts/init_book.py
"""

[tasks.test]
description = "Run test suite inside prod container"
run = """
container run --rm \
  -v {{config_root}}/.test-data:/data:rw \
  -e GNUCASH_BOOK_PATH=/data/project.gnucash \
  gnucash-mcp:latest \
  python3 -m pytest /src/tests/ -v
"""

[tasks.clean]
description = "Remove ephemeral test data"
run = "rm -f {{config_root}}/.test-data/*.gnucash* {{config_root}}/.test-data/*.jsonl"
