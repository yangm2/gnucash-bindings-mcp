[settings]
lockfile = true

[env]
WORKER_DIR = "{{config_root}}/worker"
PROXY_DIR = "{{config_root}}/proxy"
DATA_DIR = "{{config_root}}/.test-data"
GNUCASH_BOOK_PATH = "/data/project.gnucash"

[tools]
container = "latest"
swiftformat = { version = "latest", no_app = "true", rename_exe = "swiftformat" }
swiftlint = "latest"

# -- container system --

[tasks.start-container-system]
description = "Start container system (if not already running)"
run = "container system status || container system start"

[tasks.prune-images]
description = "Prune unused images"
run = "container image prune --all && container image list"

[tasks.prune-volumes]
description = "Prune unused volumes"
run = "container volume prune && container volume list"

[tasks.delete-build-images]
description = "Delete dev image to force rebuild on next build-dev"
run = "container image delete --force gnucash-mcp:dev gnucash-mcp:latest"

[tasks.shutdown-container-system]
description = "Shutdown container system"
run = "container system stop"

# ── install ───────────────────────────────────────────────────────────────────

[tasks.install-all]
description = "One-time setup: build images, init book, create sparsebundle, install proxy. For upgrades use install-app."
depends = ["create-book-volume", "install-app"]

[tasks.create-book-volume]
description = "Create ~/books/project.sparsebundle and migrate book into it (one-time)"
depends = ["init-book"]
run = "{{config_root}}/bin/create-book-volume.zsh"

[tasks.build-proxy]
description = "Build gnucash-mcp Swift binary (release)"
run = """
set -euo pipefail
GIT_HASH=$(git -C {{config_root}} rev-parse --short HEAD 2>/dev/null || echo "dev")
GIT_DATE=$(git -C {{config_root}} log -1 --format=%cd --date=short 2>/dev/null || echo "unknown")
GIT_DIRTY=$(git -C {{config_root}} status --porcelain 2>/dev/null | grep -q . && echo "+dirty" || echo "")
printf '// Auto-generated by build-proxy mise task. Do not edit.\nlet buildCommit = "%s%s"\nlet buildDate = "%s"\n' \
  "$GIT_HASH" "$GIT_DIRTY" "$GIT_DATE" \
  > ${PROXY_DIR}/Sources/gnucash-mcp/Version.swift
SANDBOX_FLAG=${CLAUDECODE:+--disable-sandbox}
cd ${PROXY_DIR} && \
  swift build --configuration release $SANDBOX_FLAG \
    --build-path "$TMPDIR/gnucash-mcp-build"
"""

[tasks.uninstall-app]
description = "Remove gnucash-mcp binary, LaunchAgent plist, and Claude Desktop registration"
run = """
set -euo pipefail
INSTALL_DIR="$HOME/.local/bin"
CLAUDE_CONFIG="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
PLIST="$HOME/Library/LaunchAgents/com.gnucash-mcp.myproject.plist"
BINARY="${INSTALL_DIR}/gnucash-mcp"

# Remove mcpServers entry from Claude Desktop config
if [[ -f "$CLAUDE_CONFIG" ]]; then
  python3 - "$CLAUDE_CONFIG" <<'PY'
import json, sys
path = sys.argv[1]
with open(path) as f:
    cfg = json.load(f)
cfg.get("mcpServers", {}).pop("gnucash-myproject", None)
with open(path, "w") as f:
    json.dump(cfg, f, indent=2, sort_keys=True)
    print(file=f)
PY
  echo "Removed gnucash-myproject from $CLAUDE_CONFIG"
else
  echo "Claude Desktop config not found — skipping"
fi

# Unload and remove LaunchAgent
if [[ -f "$PLIST" ]]; then
  launchctl unload "$PLIST" 2>/dev/null || true
  rm "$PLIST"
  echo "Removed $PLIST"
else
  echo "LaunchAgent not found — skipping"
fi

# Remove binary
if [[ -f "$BINARY" ]]; then
  rm "$BINARY"
  echo "Removed $BINARY"
else
  echo "Binary not found — skipping"
fi

echo ""
echo "Done. Restart Claude Desktop to deregister the server."
"""

[tasks.install-app]
description = "Build and install gnucash-mcp binary, then register with Claude Desktop (safe to re-run for upgrades)"
depends = ["build-proxy", "build"]
run = """
set -euo pipefail
INSTALL_DIR="$HOME/.local/bin"
mkdir -p "${INSTALL_DIR}"

echo "Installing to ${INSTALL_DIR}/gnucash-mcp…"
cp "$TMPDIR/gnucash-mcp-build/release/gnucash-mcp" "${INSTALL_DIR}/gnucash-mcp"
chmod +x "${INSTALL_DIR}/gnucash-mcp"

echo "Registering with Claude Desktop…"
CLAUDE_CONFIG="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
mkdir -p "$HOME/Library/Application Support/Claude"
python3 - "${INSTALL_DIR}/gnucash-mcp" "$CLAUDE_CONFIG" <<'PY'
import json, sys
binary, path = sys.argv[1], sys.argv[2]
try:
    with open(path) as f:
        cfg = json.load(f)
except FileNotFoundError:
    cfg = {}
cfg.setdefault("mcpServers", {})["gnucash-myproject"] = {
    "command": binary,
    "args": ["start"],
}
with open(path, "w") as f:
    json.dump(cfg, f, indent=2, sort_keys=True)
    print(file=f)
print(f"Wrote: {path}")
PY

echo ""
echo "Done. Restart Claude Desktop to pick up the new version."
echo "Binary: ${INSTALL_DIR}/gnucash-mcp"
"""

# ── build ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build prod image (gnucash-mcp:latest)"
run = "container build --pull -t gnucash-mcp:latest ${WORKER_DIR}"

[tasks.build-dev]
description = "Build dev image (gnucash-mcp:dev) — includes uv/ruff/pyright"
depends = ["start-container-system"]
run = "container build --pull --target dev -t gnucash-mcp:dev ${WORKER_DIR}"

# ── dev tools ─────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "ruff format in dev container (source volume-mounted)"
depends = []
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -v ${WORKER_DIR}/tests:/src/tests:rw \
  --entrypoint bash \
  gnucash-mcp:dev \
  -c "cd /src && \
  uv run --active ruff format gnucash_mcp scripts tests"
"""

[tasks.lint]
description = "ruff check + pyright typecheck in dev container (source volume-mounted)"
depends = ["fmt"]
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -v ${WORKER_DIR}/tests:/src/tests:rw \
  -v ${WORKER_DIR}/typings:/src/typings:ro \
  -v ${WORKER_DIR}/pyrightconfig.json:/src/pyrightconfig.json:ro \
  --entrypoint bash \
  gnucash-mcp:dev \
  -c "cd /src && \
    uv run --active ruff check --fix --no-cache gnucash_mcp scripts tests && \
    uv run --active pyright gnucash_mcp scripts tests"
"""

[tasks.test]
description = "Run test suite in dev container"
depends = []
run = """
container run --rm \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:ro \
  -v ${WORKER_DIR}/scripts:/src/scripts:ro \
  -v ${WORKER_DIR}/tests:/src/tests:ro \
  --entrypoint bash \
  gnucash-mcp:dev \
  -c "cd /src && uv run --active --frozen pytest tests/ -v"
"""

[tasks.swiftfmt]
description = "Format Swift code"
run = """
SANDBOX_FLAG=${CLAUDECODE:- --verbose}
swiftformat $SANDBOX_FLAG ${PROXY_DIR}
"""

[tasks.swiftlint]
description = "Lint Swift code"
depends = ["swiftfmt"]
run = """
SANDBOX_FLAG=${CLAUDECODE:- --fix}
swiftlint lint $SANDBOX_FLAG ${PROXY_DIR}
"""

[tasks.swift-test]
description = "Run Swift proxy tests"
run = """
SANDBOX_FLAG=${CLAUDECODE:+--disable-sandbox}
cd ${PROXY_DIR} && \
swift test $SANDBOX_FLAG --build-path "$TMPDIR/gnucash-mcp-build"
"""

# ── runtime ───────────────────────────────────────────────────────────────────

[tasks.init-book]
description = """Initialize GnuCash book in .test-data/
  — required once before 'mise run' or 'mise shell'; not
  needed for 'mise test' (fixtures create their own books)"""
depends = ["build"]
run = """
set -euo pipefail
mkdir -p "${DATA_DIR}"
container run --rm \
  -v ${DATA_DIR}:/data:rw \
  -e GNUCASH_BOOK_PATH \
  --entrypoint python3 \
  gnucash-mcp:latest \
  /src/scripts/init_book.py \
|| { echo "error: init-book failed — see container output above"; exit 1; }
"""

[tasks.run]
description = "One-shot dispatch: pipe JSON-RPC on stdin → stdout"
depends = ["init-book"]
run = """
container run --rm -i \
  -v ${DATA_DIR}:/data:rw \
  -e GNUCASH_BOOK_PATH \
  gnucash-mcp:latest
"""

[tasks.shell]
description = "Interactive shell in prod container"
depends = ["init-book"]
run = """
container run --rm -it \
  -v ${DATA_DIR}:/data:rw \
  -e GNUCASH_BOOK_PATH \
  --entrypoint /bin/bash \
  gnucash-mcp:latest
"""

[tasks.shell-dev]
description = "Interactive shell in dev container with source mounted rw"
depends = ["build-dev", "init-book"]
run = """
container run --rm -it \
  -v ${DATA_DIR}:/data:rw \
  -v ${WORKER_DIR}/gnucash_mcp:/src/gnucash_mcp:rw \
  -v ${WORKER_DIR}/scripts:/src/scripts:rw \
  -e GNUCASH_BOOK_PATH \
  --entrypoint /bin/bash \
  gnucash-mcp:dev
"""

[tasks.clean]
description = "Remove ephemeral test data"
run = "rm -f ${DATA_DIR}/*.gnucash* ${DATA_DIR}/*.jsonl"

[tasks.cleaner]
description = "Clean all build artifacts and test data (images, volumes, etc.)"
depends = ["delete-build-images", "clean"]
